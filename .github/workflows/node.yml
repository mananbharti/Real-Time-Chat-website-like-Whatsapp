name: Node.js

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check server
        run: node --check server.js

      - name: Smoke test
        run: |
          node server.js &
          pid=$!
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000/ >/dev/null
          kill "$pid"
